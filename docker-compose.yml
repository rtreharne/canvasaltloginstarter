services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canvas_magic}
      POSTGRES_USER: ${POSTGRES_USER:-canvas_magic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canvas_magic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-canvas_magic} -d ${POSTGRES_DB:-canvas_magic}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "pip install -r requirements.txt && python manage.py migrate && (python manage.py createsuperuser --noinput || true) && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8998:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip

volumes:
  postgres_data:
  pip_cache:
